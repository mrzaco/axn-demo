<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231A5CFF'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' fill='white' text-anchor='middle'%3E%E5%AE%89%3C/text%3E%3C/svg%3E" />
      <!-- viewport-fit=cover：让 env(safe-area-inset-*) 在 iPhone 上返回真实值（否则恒为 0）。
           interactive-widget=resizes-content：安卓 Chrome 弹出软键盘时收缩布局视口，
           否则键盘直接盖住底部输入区。 -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
      <!-- 移动端浏览器地址栏配色，与首屏白色顶栏一致（theme.ts 的 colorBgContainer） -->
      <meta name="theme-color" content="#FFFFFF" />
    <title>安小能 · 应急智能工作台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
